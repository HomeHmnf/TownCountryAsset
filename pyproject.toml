[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "town-country-asset"
version = "0.1.0"
description = "Build-time Natural Earth country asset compiler for Godot"
requires-python = ">=3.10"
dependencies = ["shapely>=2.0", "pyshp>=2.3"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
